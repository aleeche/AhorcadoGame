<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahorcado - Nivel Fácil</title>
    <link rel="stylesheet" href="../styles/facil_styles.css">
    <link rel="stylesheet" href="../styles/responsive.css">
    <link rel="icon" href="../img/logo1.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Press+Start+2P&display=swap" rel="stylesheet">

    <audio id="audio" autoplay loop>
        <source src="../audio/facilMusic.mp3" type="audio/mpeg">
    </audio>
    <script>
        const palabras = [
            "gato", "casa", "sol", "flor", "luz", "perro", "pan",
            "arbol", "hoja", "pasto", "vaca", "tractor", "granja",
            "semilla", "pollo", "cosecha", "tierra", "arroyo", "campo", "fruta"
        ];//Definir un array de palabras para el nivel fácil, de las cuales se seleccionará la palabra secreta aleatoriamente.
    </script>
</head>

<body onclick="PlayAudioFondo()">
    <div class="particles"></div>
    <div class="container">
        <h1>Juego del Ahorcado - Nivel Fácil</h1>

        <div class="main-section">
            <!-- Lugar donde se dibuja el muñeco -->
            <canvas id="personCanvas" width="300" height="300"></canvas>

            <!-- Letras ya usadas -->
            <div class="used-letters-box">
                <h3>Letras usadas:</h3>
                <p id="usedLetters">Ninguna</p>
            </div>
        </div>

        <!-- Palabra oculta -->
        <div id="wordContainer" class="word-container"></div>

        <!-- Teclado virtual -->
        <div id="keyboard" class="keyboard"></div>

        <!-- Probar palabra completa -->
        <div class="guess-section">
            <input type="text" id="guessInput" placeholder="Escribe la palabra completa">
            <button id="guessButton">Probar palabra</button>
        </div>

        <!-- Mensajes de victoria o derrota -->
        <div id="message" class="message"></div>

        <!-- Botón reiniciar -->
        <button id="restartButton" style="display:none;">Reiniciar Juego</button>
        <a href="../index.html"><button>Volver al Menú</button></a>
    </div>
    <script src="../script/funcionalidad.js"></script>
</body>

</html>
