    <script>
        // ---- Pantalla de carga: espera a que las imágenes del nivel estén descargadas ----
        (function () {
            const pantalla = document.getElementById("pantallaCarga");
            const imagenes = ["../img/campoSangre.png", "../img/celebration.png"];
            let terminado = false;

            function ocultar() {
                if (terminado) return;
                terminado = true;
                document.body.classList.remove("cargando");
                pantalla.classList.add("oculta");
                setTimeout(() => pantalla.remove(), 500);
            }

            const cargas = imagenes.map((src) => new Promise((resolve) => {
                const img = new Image();
                img.onload = img.onerror = resolve; // si una falla, no bloqueamos el nivel
                img.src = src;
            }));
            const fuentes = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();

            Promise.all([...cargas, fuentes]).then(ocultar);
            setTimeout(ocultar, 8000); // seguro: nunca dejar al usuario atrapado en la carga
            window.addEventListener("pageshow", ocultar);
        })();
    </script>
